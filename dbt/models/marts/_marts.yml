version: 2

models:
  - name: fct_views
    description: >
      One row per view, with session, calendar attributes and the estimated watch seconds.
      Watch time is an ESTIMATE from gaps between views (see watch_time_estimation).
    columns:
      - name: view_id
        description: Stable view key.
        data_tests: [unique, not_null]
      - name: video_id
        description: TikTok video ID.
        data_tests: [not_null]
      - name: session_id
        description: Session this view belongs to (see fct_sessions).
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_sessions'), field: session_id}}
      - name: event_ts_utc
        description: View start time in UTC.
      - name: event_ts_local
        description: View start time in the local timezone.
      - name: local_date
        description: Local calendar date of the view (midnight boundary).
        data_tests: [not_null]
      - name: local_hour
        description: Local hour of the view, 0-23.
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 23}}
      - name: dow
        description: ISO day of week, 1 = Monday ... 7 = Sunday.
      - name: is_weekend
        description: True on Saturday and Sunday.
      - name: is_late_night
        description: True when local_hour is in [late_night_start_hour, late_night_end_hour).
      - name: gap_to_next_sec
        description: Seconds until the next view in the whole history (null for the last view).
      - name: view_seq_in_session
        description: 1-based position of the view within its session.
      - name: is_last_in_session
        description: True for the final view of a session.
      - name: est_watch_sec
        description: >
          Estimated seconds watched. Not last in session: min(gap to next view, view_cap_sec).
          Last in session: median of the other estimates in the session, or
          default_last_view_sec for single-view sessions.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: "{{ var('view_cap_sec') }}"
      - name: is_rewatch
        description: True when the same video was viewed earlier in the loaded history.

  - name: fct_sessions
    description: One row per viewing session. local_date is the session's start date.
    columns:
      - name: session_id
        description: view_id of the first view in the session.
        data_tests: [unique, not_null]
      - name: start_ts_local
        description: Local start time of the first view.
      - name: end_ts_local
        description: Local start time of the last view (observed, not an estimated end).
      - name: local_date
        description: Local date the session started.
        data_tests: [not_null]
      - name: n_views
        description: Number of views in the session.
        data_tests:
          - accepted_range: {arguments: {min_value: 1}}
      - name: est_watch_sec
        description: Sum of est_watch_sec over the session's views.
        data_tests:
          - accepted_range: {arguments: {min_value: 0}}
      - name: is_binge
        description: True when est_watch_sec >= binge_threshold_min minutes.

  - name: fct_likes
    description: One row per like.
    columns:
      - name: like_id
        data_tests: [unique, not_null]
      - name: video_id
        description: Liked video.
      - name: event_ts_local
        description: Local time of the like.
      - name: local_date
        description: Local date of the like.
      - name: liked_after_watch
        description: >
          True when the same video was viewed at or before the like, at most session_gap_min
          minutes earlier.

  - name: fct_searches
    description: One row per search.
    columns:
      - name: search_id
        data_tests: [unique, not_null]
      - name: search_term_norm
        description: Normalised search term (lower-case, trimmed, single spaces).
      - name: event_ts_local
        description: Local time of the search.
      - name: local_date
        description: Local date of the search.

  - name: dim_date
    description: >
      Contiguous date spine over the watch-history window (first to last date with a view), so
      zero-activity days inside it exist. Days outside it are not included (unknown, not zero).
      Likes and searches outside the window are in fct_likes and fct_searches only.
    columns:
      - name: local_date
        data_tests: [unique, not_null]
      - name: dow
        description: ISO day of week, 1 = Monday ... 7 = Sunday.
      - name: dow_name
        description: Day name, e.g. Monday.
      - name: is_weekend
        description: True on Saturday and Sunday.
      - name: iso_week
        description: ISO week label, e.g. 2026-W47 (weeks run Monday-Sunday).
      - name: week_start
        description: Monday of the ISO week.
      - name: month
        description: Month number 1-12.
      - name: month_start
        description: First day of the month.
      - name: year
        description: Calendar year.

  - name: agg_daily
    description: >
      One row per dim_date day with zero-filled daily totals. View-level columns use each
      view's own date; session-level columns use the session's start date.
    columns:
      - name: local_date
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: local_date}}
      - name: views
        description: Views that day.
      - name: est_watch_min
        description: Estimated watch minutes that day (sum of the day's views' estimates / 60).
      - name: sessions
        description: Sessions that started that day.
      - name: longest_session_min
        description: Longest session (estimated minutes) among sessions that started that day.
      - name: late_night_views
        description: Views with is_late_night that day.
      - name: likes
        description: Likes that day.
      - name: searches
        description: Searches that day.
      - name: is_active
        description: True when the day has at least one view.
      - name: active_days_7d
        description: Active days in the 7-day window ending on this date (inclusive).
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 7}}
