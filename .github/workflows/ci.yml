name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      - name: CLI help
        run: uv run scrollback --help
      - name: Synthetic samples are reproducible
        run: |
          uv run scrollback synth
          uv run scrollback synth --variant v1_activity --out data/sample/user_data_tiktok_v1.json
          git diff --exit-code data/sample
      - name: Synth -> ingest + dbt build (twice)
        run: |
          uv run scrollback ingest data/sample/user_data_tiktok.json --db "$RUNNER_TEMP/wh.duckdb"
          uv run scrollback ingest data/sample/user_data_tiktok.json --db "$RUNNER_TEMP/wh.duckdb"
      - name: dbt build (standalone)
        run: uv run scrollback build --db "$RUNNER_TEMP/wh.duckdb"
      - name: Inspect gaps
        run: uv run scrollback inspect gaps --db "$RUNNER_TEMP/wh.duckdb"
      - name: Eval gold-SQL validity check
        run: uv run scrollback eval check-gold
