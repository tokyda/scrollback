  # ------------------------------------------------------------------------- metric_definition
  - id: q022
    question: What share of my views in October 2026 were late at night?
    category: metric_definition
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: late night = local hours [0, 5); not 22:00-05:00 or [0, 6)
    answer_type: scalar
    gold_sql: |
      SELECT avg(CASE WHEN is_late_night THEN 1.0 ELSE 0.0 END) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
    units: [ratio]
    tolerance: 0.005
    expected_metrics: [late_night_share]
    wrong_values: [0.2948, 0.1775]
    likely_failure: wrong_metric_definition

  - id: q023
    question: What was my average session length in October 2026, in minutes?
    category: metric_definition
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: session length = estimated watch time, not first-to-last-view span
    answer_type: scalar
    gold_sql: |
      SELECT avg(est_watch_sec) / 60.0 FROM fct_sessions
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
    units: [minutes]
    tolerance: 0.05
    expected_metrics: [avg_session_minutes]
    wrong_values: [17.78]
    likely_failure: wrong_metric_definition

  - id: q024
    question: How many binge sessions have I had?
    category: metric_definition
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: binge = session with >= 60 min estimated watch time (not span >= 60 min)
    answer_type: scalar
    gold_sql: SELECT count(*) FROM fct_sessions WHERE is_binge
    units: [count]
    expected_metrics: [binge_sessions]
    wrong_values: [26]
    likely_failure: wrong_metric_definition

  - id: q025
    question: What is my rewatch rate in November 2026 so far?
    category: metric_definition
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: rewatch rate = views of an already-seen video / views
    answer_type: scalar
    gold_sql: |
      SELECT avg(CASE WHEN is_rewatch THEN 1.0 ELSE 0.0 END) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-11-01' AND DATE '2026-11-20'
    units: [ratio]
    tolerance: 0.002
    expected_metrics: [rewatch_rate]
    likely_failure: wrong_metric_definition

  - id: q026
    question: What was my like rate in October 2026?
    category: metric_definition
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: like rate = likes / views in the same period
    answer_type: scalar
    gold_sql: |
      SELECT sum(likes) * 1.0 / sum(views) FROM agg_daily
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
    units: [ratio]
    tolerance: 0.002
    expected_metrics: [like_rate]
    likely_failure: wrong_metric_definition

  - id: q027
    question: How many active days did I have in September 2026?
    category: metric_definition
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: active day = day with >= 1 view (detox week has zero days)
    answer_type: scalar
    gold_sql: |
      SELECT count(DISTINCT local_date) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    units: [count]
    expected_metrics: [active_days]
    wrong_values: [30]
    likely_failure: wrong_metric_definition

  - id: q028
    question: What share of my views in October 2026 happened on weekends?
    category: metric_definition
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: weekend share = Sat+Sun views / views
    answer_type: scalar
    gold_sql: |
      SELECT avg(CASE WHEN is_weekend THEN 1.0 ELSE 0.0 END) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
    units: [ratio]
    tolerance: 0.005
    expected_metrics: [weekend_share]

  - id: q029
    question: What was my longest streak of consecutive active days between 1 June and 31 August 2026?
    category: metric_definition
    difficulty: hard
    split: test
    today: 2026-11-20
    tests: streak = longest run of consecutive active days inside the range (gaps and islands)
    answer_type: scalar
    gold_sql: |
      WITH days AS (
          SELECT local_date FROM agg_daily
          WHERE is_active AND local_date BETWEEN DATE '2026-06-01' AND DATE '2026-08-31'
      ),
      runs AS (
          SELECT local_date - CAST(row_number() OVER (ORDER BY local_date) AS INTEGER) AS k
          FROM days
      )
      SELECT max(n) FROM (SELECT k, count(*) AS n FROM runs GROUP BY k)
    units: [days]
    expected_metrics: [streak_days]

  # ------------------------------------------------------------------------- comparison
  - id: q030
    question: In September 2026, what was my average daily watch time on weekdays and on weekends?
    category: comparison
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: per-calendar-day averages include zero-activity days (detox week)
    answer_type: table
    gold_sql: |
      SELECT avg(est_watch_min) FILTER (WHERE NOT is_weekend) AS weekday_min,
             avg(est_watch_min) FILTER (WHERE is_weekend) AS weekend_min
      FROM agg_daily WHERE local_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    units: [minutes, minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]
    wrong_values: [22.36, 55.23]
    likely_failure: aggregation_error

  - id: q031
    question: How did my total watch time in October 2026 compare with September 2026? Give both in minutes.
    category: comparison
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: two monthly totals side by side
    answer_type: table
    gold_sql: |
      SELECT sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') / 60.0 AS oct_min,
             sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30') / 60.0 AS sep_min
      FROM fct_views
    units: [minutes, minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]

  - id: q032
    question: Compare my total watch time in the week starting Monday 19 October 2026 with the week before.
    category: comparison
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: two explicit Monday-Sunday weeks
    answer_type: table
    gold_sql: |
      SELECT sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-10-19' AND DATE '2026-10-25') / 60.0 AS wk_19oct,
             sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-10-12' AND DATE '2026-10-18') / 60.0 AS wk_12oct
      FROM fct_views
    units: [minutes, minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]
    likely_failure: wrong_time_window

  - id: q033
    question: Do I watch more videos in the morning (6am to noon) or in the evening (6pm to midnight)? Give both counts.
    category: comparison
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: hour-band comparison with explicit boundaries
    answer_type: table
    gold_sql: |
      SELECT count(*) FILTER (WHERE local_hour >= 6 AND local_hour < 12) AS morning,
             count(*) FILTER (WHERE local_hour >= 18) AS evening
      FROM fct_views
    units: [count, count]
    expected_metrics: [views]

  - id: q034
    question: How does my watch time so far this week compare with the whole of last week?
    category: comparison
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: "this week so far (Mon 16 - Fri 20 Nov) vs last week (9-15 Nov), both relative"
    answer_type: table
    gold_sql: |
      SELECT sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-11-16' AND DATE '2026-11-20') / 60.0 AS this_week,
             sum(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-11-09' AND DATE '2026-11-15') / 60.0 AS last_week
      FROM fct_views
    units: [minutes, minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]
    likely_failure: wrong_time_window

  - id: q035
    question: Was my average session longer in October or in November 2026? Give both averages in minutes.
    category: comparison
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: session length = estimated watch time; sessions by start month
    answer_type: table
    gold_sql: |
      SELECT avg(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') / 60.0 AS oct_avg,
             avg(est_watch_sec) FILTER (WHERE local_date BETWEEN DATE '2026-11-01' AND DATE '2026-11-30') / 60.0 AS nov_avg
      FROM fct_sessions
    units: [minutes, minutes]
    tolerance: 0.05
    expected_metrics: [avg_session_minutes]
    likely_failure: wrong_metric_definition

  # ------------------------------------------------------------------------- ranking
  - id: q036
    question: What are my top 3 search terms?
    category: ranking
    difficulty: easy
    split: dev
    today: 2026-11-20
    tests: ranking on the normalised search term
    answer_type: ordered_table
    gold_sql: |
      SELECT search_term_norm FROM fct_searches
      GROUP BY 1 ORDER BY count(*) DESC, 1 LIMIT 3
    units: [text]
    expected_metrics: [searches]

  - id: q037
    question: Which day in October 2026 did I watch the most, by watch time?
    category: ranking
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: argmax over days by estimated minutes
    answer_type: scalar
    gold_sql: |
      SELECT local_date FROM agg_daily
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      ORDER BY est_watch_min DESC LIMIT 1
    units: [date]
    expected_metrics: [est_watch_minutes]

  - id: q038
    question: Which day of the week has my highest average daily watch time?
    category: ranking
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: average per calendar day of week (zero days included)
    answer_type: scalar
    gold_sql: |
      SELECT dayname(local_date) FROM agg_daily
      GROUP BY 1 ORDER BY avg(est_watch_min) DESC LIMIT 1
