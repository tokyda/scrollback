    expected_metrics: [avg_session_minutes]
    likely_failure: wrong_metric_definition

  - id: q040
    question: Which video have I rewatched the most?
    category: ranking
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: argmax views per video_id (video IDs allowed in results)
    answer_type: scalar
    gold_sql: |
      SELECT video_id FROM fct_views GROUP BY 1 ORDER BY count(*) DESC, 1 LIMIT 1
    units: [text]
    expected_metrics: [rewatch_rate]

  - id: q041
    question: Rank the days of the week by total number of views, highest first.
    category: ranking
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: full ordering of 7 days of week
    answer_type: ordered_table
    gold_sql: |
      SELECT dayname(local_date) FROM fct_views GROUP BY 1 ORDER BY count(*) DESC
    units: [dow]
    expected_metrics: [views]

  # ------------------------------------------------------------------------- session_derived
  - id: q042
    question: How many sessions did I have last week, and how long was the longest one?
    category: session_derived
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: "Phase 3 Q5 as-is: longest = estimated watch time (34.7 min), not span (62 min)"
    answer_type: table
    gold_sql: |
      SELECT count(*) AS sessions, max(est_watch_sec) / 60.0 AS longest_min FROM fct_sessions
      WHERE local_date BETWEEN DATE '2026-11-09' AND DATE '2026-11-15'
    units: [count, minutes]
    tolerance: 0.05
    expected_metrics: [sessions]
    wrong_values: [62.03, 3722]
    likely_failure: wrong_metric_definition

