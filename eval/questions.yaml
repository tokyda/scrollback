    today: 2026-10-01
    tests: "'last month' on 1 Oct = September"
    answer_type: scalar
    gold_sql: |
      SELECT count(*) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    units: [count]
