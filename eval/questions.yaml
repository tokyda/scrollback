    expected_metrics: [sessions]
    likely_failure: wrong_time_window

  - id: q019
    question: How many minutes did I watch last weekend?
    category: relative_date
    difficulty: medium
    split: dev
    today: 2026-10-26
    tests: "'last weekend' asked on Monday = Sat 24 + Sun 25 Oct"
    answer_type: scalar
    gold_sql: |
      SELECT sum(est_watch_sec) / 60.0 FROM fct_views
      WHERE local_date BETWEEN DATE '2026-10-24' AND DATE '2026-10-25'
    units: [minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]
    likely_failure: wrong_time_window

  - id: q020
    question: How many videos did I watch last month?
    category: relative_date
    difficulty: easy
