    units: [minutes]
    tolerance: 0.05
    expected_metrics: [avg_session_minutes]
    wrong_values: [15.68]
    likely_failure: timezone_or_day_boundary

  - id: q045
    question: On average, how many sessions did I have per day in October 2026?
    category: session_derived
    difficulty: medium
    split: test
    today: 2026-11-20
    tests: sessions / calendar days in the month
    answer_type: scalar
    gold_sql: |
      SELECT count(*) / 31.0 FROM fct_sessions
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
