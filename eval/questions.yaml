      SELECT count(*) FROM fct_likes
      WHERE local_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    units: [count]
    expected_metrics: [likes]

  - id: q010
    question: How many minutes did I watch on Saturday 24 October 2026?
    category: time_window
    difficulty: medium
    split: test
    today: 2026-11-20
