# Scrollback eval set (DESIGN §7.1). Gold SQL follows knowledge/metrics.yml and the glossary
# (knowledge/docs/), not the agent's habits; questions were written without running the agent.
#
# Each question runs against a warehouse built from the committed synthetic sample filtered to
# local dates <= `today` (as if exported at the end of that day), using the params below.
# `split`: dev (iterate on in Phase 5) / test (held out: baseline and final runs only).
# `alternatives`: other acceptable readings (ambiguous questions only).
# `wrong_values`: numbers that only come from a wrong definition; stating one fails the answer.
# `units`: one per gold column; drive tolerant matching (ratio~%, seconds~minutes~hours, ...).

version: 1

params:
  timezone:
    source_tz: UTC
    local_tz: Asia/Singapore
  metrics:
    session_gap_min: 30
    view_cap_sec: 180
    default_last_view_sec: 20
    binge_threshold_min: 60
    late_night_start_hour: 0
    late_night_end_hour: 5
    max_daily_views: 3000
    freshness_warn_days: 14

questions:

  # ------------------------------------------------------------------------- simple_agg
  - id: q001
    question: How many videos have I watched in total?
    category: simple_agg
    difficulty: easy
    split: dev
    today: 2026-11-20
    tests: all-time view count
    answer_type: scalar
    gold_sql: SELECT count(*) FROM fct_views
    units: [count]
    expected_metrics: [views]

  - id: q002
    question: How many videos have I liked in total?
    category: simple_agg
    difficulty: easy
    split: dev
    today: 2026-11-20
    tests: all-time like count from the likes table
    answer_type: scalar
    gold_sql: SELECT count(*) FROM fct_likes
    units: [count]
    expected_metrics: [likes]

  - id: q003
    question: How many different videos have I watched?
    category: simple_agg
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: distinct videos, not views (rewatches counted once)
    answer_type: scalar
    gold_sql: SELECT count(DISTINCT video_id) FROM fct_views
    units: [count]
    expected_metrics: [unique_videos]
    wrong_values: [11885]
    likely_failure: wrong_metric_definition

  - id: q004
    question: How many searches have I made on TikTok?
    category: simple_agg
    difficulty: easy
    split: test
    today: 2026-11-20
    tests: all-time search count
    answer_type: scalar
    gold_sql: SELECT count(*) FROM fct_searches
    units: [count]
    expected_metrics: [searches]

  - id: q005
    question: On how many days have I used TikTok?
    category: simple_agg
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: active days (>= 1 view), not the number of calendar days in the history
    answer_type: scalar
    gold_sql: SELECT count(DISTINCT local_date) FROM fct_views
    units: [count]
    expected_metrics: [active_days]
    wrong_values: [180]
    likely_failure: wrong_metric_definition

  - id: q006
    question: How many viewing sessions are in my history?
    category: simple_agg
    difficulty: easy
    split: test
    today: 2026-11-20
    tests: all-time session count
    answer_type: scalar
    gold_sql: SELECT count(*) FROM fct_sessions
    units: [count]
    expected_metrics: [sessions]

  # ------------------------------------------------------------------------- time_window
  - id: q007
    question: How many minutes did I watch in October 2026?
    category: time_window
    difficulty: medium
    split: dev
    today: 2026-11-20
    tests: estimated watch minutes over a calendar month
    answer_type: scalar
    gold_sql: |
      SELECT sum(est_watch_sec) / 60.0 FROM fct_views
      WHERE local_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
    units: [minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]

  - id: q008
    question: How many videos did I watch between 1 and 15 August 2026?
    category: time_window
    difficulty: easy
    split: dev
    today: 2026-11-20
    tests: inclusive date range inside a month
    answer_type: scalar
    gold_sql: |
      SELECT count(*) FROM fct_views
      WHERE local_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-15'
    units: [count]
    expected_metrics: [views]
    likely_failure: wrong_time_window

  - id: q009
    question: How many videos did I like in September 2026?
    category: time_window
    difficulty: easy
    split: dev
