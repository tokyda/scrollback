    split: test
    today: 2026-11-20
    tests: sessions ranked by estimated watch time, dated by start date
    answer_type: ordered_table
    gold_sql: |
      SELECT local_date FROM fct_sessions GROUP BY 1 ORDER BY max(est_watch_sec) DESC LIMIT 3
