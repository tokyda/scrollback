    question: What was my longest run of consecutive days without watching anything?
    category: multi_step
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: gaps and islands over inactive days (11-13 Sep = 3), not the detox week span (6)
    answer_type: scalar
    gold_sql: |
      WITH idle AS (SELECT local_date FROM agg_daily WHERE NOT is_active),
      runs AS (
          SELECT local_date - CAST(row_number() OVER (ORDER BY local_date) AS INTEGER) AS k
          FROM idle
      )
      SELECT max(n) FROM (SELECT k, count(*) AS n FROM runs GROUP BY k)
    units: [days]
    expected_metrics: [active_days]
    wrong_values: [6, 7]
    likely_failure: aggregation_error

