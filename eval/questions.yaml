  - id: q052
    question: Between the weeks starting 5 October and 26 October 2026, which week had the biggest increase in watch time over the week before, and by how many minutes?
    category: multi_step
    difficulty: hard
    split: dev
    today: 2026-11-20
    tests: weekly totals, week-over-week difference, argmax
    answer_type: table
    gold_sql: |
      WITH weekly AS (
          SELECT d.week_start, sum(a.est_watch_min) AS minutes
          FROM agg_daily a JOIN dim_date d USING (local_date)
          WHERE d.week_start BETWEEN DATE '2026-09-28' AND DATE '2026-10-26'
          GROUP BY 1
      ),
      diffs AS (
          SELECT week_start, minutes - lag(minutes) OVER (ORDER BY week_start) AS increase
          FROM weekly
      )
      SELECT week_start, increase FROM diffs
      WHERE week_start >= DATE '2026-10-05' ORDER BY increase DESC LIMIT 1
    units: [date, minutes]
    tolerance: 0.05
    expected_metrics: [est_watch_minutes]

